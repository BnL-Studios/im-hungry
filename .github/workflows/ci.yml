name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mobile:
    name: Mobile (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Expo project configuration
        run: |
          node -e "const p = require('./package.json'); if (!p.dependencies?.expo || !p.dependencies?.['expo-router']) process.exit(1)"
          node -e "JSON.parse(require('node:fs').readFileSync('./app.json', 'utf8'))"

      - name: Typecheck
        run: npx tsc --noEmit

# Add unit tests, SQLite migration checks, and Edge Function tests as those parts are implemented.
