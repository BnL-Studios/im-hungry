name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# CI only needs to read the repository. No Supabase or AI secrets are required.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest

    # Isolated, disposable test database; never connect CI to shared Supabase.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: imhungry_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d imhungry_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      SPRING_PROFILES_ACTIVE: ci
      DB_URL: jdbc:postgresql://localhost:5432/imhungry_ci?currentSchema=imhungry
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties

      # Hibernate is configured to use the "imhungry" PostgreSQL schema.
      - name: Create isolated database schema
        run: |
          PGPASSWORD="$DB_PASSWORD" psql \
            --host=localhost \
            --username="$DB_USERNAME" \
            --dbname=imhungry_ci \
            --command='CREATE SCHEMA IF NOT EXISTS imhungry;'

      - name: Build and run backend tests
        run: bash ./mvnw --batch-mode --no-transfer-progress verify
