spring.application.name=imhungry

# ---------------------------------------------------------------------------
# Databas
# ---------------------------------------------------------------------------
# URL:en är Supabase session-pooler (port 5432). currentSchema gör att
# search_path pekar på imhungry, default_schema nedan gör att Hibernate
# kvalificerar all genererad SQL med samma schema.
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require&currentSchema=imhungry}
spring.datasource.driver-class-name=org.postgresql.Driver

# Uppgifterna är hemliga och sätts via miljövariabler (CI/produktion) eller via
# application-local.properties, som är gitignorerad. Se application-local.properties.example.
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Supabase session-pooler tillåter max 15 klienter totalt (pool_size).
# Hikaris standard är 10 per app, vilket lätt slår i taket när app, GUI och
# tester körs samtidigt.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=imhungry
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Profiler
# ---------------------------------------------------------------------------
# Utan aktiv profil körs "local", som laddar application-local.properties.
spring.profiles.default=local
